<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Outfit:wght@800&amp;family=Plus+Jakarta+Sans:ital,wght@1,800&amp;display=swap');
      .logo-title {
        font-family: 'Caveat', 'Brush Script MT', cursive, sans-serif;
        font-size: 92px;
        font-weight: 700;
        fill: #2A8882;
        letter-spacing: -1px;
      }
      .logo-tagline {
        font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
        font-size: 24px;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 2.5px;
        fill: #F4803E;
      }
    </style>
    <clipPath id="sunClip">
      <rect x="150" y="30" width="160" height="90" rx="4" />
    </clipPath>
  </defs>

  <!-- Sol Poente Semicircular Laranja -->
  <g id="sol-icon">
    <!-- Sol alinhado no topo da onda -->
    <path d="M 175 118 A 46 46 0 0 1 267 118 Z" fill="#F4803E" />
  </g>

  <!-- Ondas Fluidas Verdes (Mar da Logo) -->
  <g id="ondas-mar" fill="#2A8882">
    <!-- Onda Superior -->
    <path d="M 140 98 C 170 128 200 134 260 125 C 315 116 350 125 390 170 C 375 160 330 145 285 146 C 215 148 185 130 140 98 Z" />
    <!-- Onda Inferior / Base com curva elegante -->
    <path d="M 115 132 C 145 158 205 168 280 156 C 330 148 375 165 410 202 C 385 186 335 174 275 178 C 190 183 145 160 115 132 Z" />
  </g>

  <!-- Tipografia Principal: Silva e Sol -->
  <text x="250" y="278" text-anchor="middle" class="logo-title">Silva e Sol</text>

  <!-- Assinatura / Slogan: DO SEU JEITO -->
  <text x="390" y="318" text-anchor="end" class="logo-tagline">DO SEU JEITO</text>
</svg>
